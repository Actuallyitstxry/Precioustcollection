<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing and Guidelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181310;
    --card:#211A16;
    --cream:#F3ECE2;
    --rose:#B98F73;
    --rose-light:#D8B79A;
    --wine:#5E2233;
    --line:rgba(243,236,226,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;}
  a{color:inherit;}

  /* HERO */
  .hero{
    padding:72px 24px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(185,143,115,0.16), transparent 60%);
    pointer-events:none;
  }
  .eyebrow{
    letter-spacing:0.35em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--rose-light);
    margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(40px,7vw,72px);
    font-weight:500;
    letter-spacing:0.01em;
    line-height:1.05;
  }
  .hero p{
    max-width:480px;
    margin:18px auto 0;
    color:rgba(243,236,226,0.65);
    font-size:15px;
    font-weight:300;
    line-height:1.6;
  }

  /* ===== GLOBAL ===== */
  .info{display:none !important;}
  .info h3{font-size:16px !important;}
  


  /* ===== CATEGORY LANDING ===== */
  .cat-grid{
    max-width:1100px;
    margin:0 auto;
    padding:56px 24px 100px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:24px;
  }
  @media (max-width:640px){ .cat-grid{ grid-template-columns:1fr; } }

  .cat-tile{
    position:relative;
    border:1px solid var(--line);
    background:linear-gradient(160deg,#241C17,#161110);
    padding:44px 32px;
    min-height:220px;
    display:flex; flex-direction:column; justify-content:flex-end;
    gap:8px;
    text-decoration:none;
    overflow:hidden;
    cursor:pointer;
    transition:transform .3s ease, border-color .3s ease;
  }
  .cat-tile:hover{ transform:translateY(-5px); border-color:var(--rose); }
  .cat-tile::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 85% 15%, rgba(185,143,115,0.18), transparent 55%);
    pointer-events:none;
  }
  .cat-index{
    position:absolute; top:20px; right:24px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:rgba(243,236,226,0.3);
  }
  .cat-tile h2{
    font-size:34px;
    font-weight:500;
  }
  .cat-tile .cat-tagline{
    font-size:13px;
    color:rgba(243,236,226,0.55);
    font-weight:300;
    max-width:320px;
  }
  .cat-tile .cat-count{
    margin-top:10px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rose-light);
  }
  .cat-tile .cat-arrow{
    position:absolute; bottom:28px; right:28px;
    font-size:20px;
    color:var(--rose-light);
    transition:transform .25s ease;
  }
  .cat-tile:hover .cat-arrow{ transform:translateX(6px); }

  /* ===== CATEGORY PAGE ===== */
  .cat-header{
    max-width:1280px;
    margin:0 auto;
    padding:40px 24px 0;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(243,236,226,0.55);
    text-decoration:none;
    margin-bottom:22px;
    transition:color .2s ease;
  }
  .back-link:hover{ color:var(--rose-light); }

  /* FILTER BAR */
  .filters{
    position:sticky; top:0; z-index:20;
    background:rgba(24,19,16,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
    display:flex; gap:12px; flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    margin-top:28px;
  }
  .filters input, .filters select{
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream);
    padding:9px 14px;
    border-radius:2px;
    font-family:'Jost',sans-serif;
    font-size:13px;
    font-weight:300;
    outline:none;
  }
  .filters input{min-width:180px;}
  .filters input::placeholder{color:rgba(243,236,226,0.4);}
  .filters select{cursor:pointer;}
  .filters option{background:var(--ink);}
  .count{
    font-size:12px;
    letter-spacing:0.08em;
    color:rgba(243,236,226,0.5);
    text-transform:uppercase;
    margin-left:auto;
  }

  /* GRID */
  .grid{
    max-width:1280px;
    margin:0 auto;
    padding:40px 24px 100px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:28px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    position:relative;
    display:flex; flex-direction:column;
    transition:transform .25s ease, border-color .25s ease;
  }
  .card:hover{ transform:translateY(-4px); border-color:var(--rose); }

  .tag{
    position:absolute; top:12px; left:0;
    background:var(--wine);
    color:var(--cream);
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:5px 12px 5px 10px;
    z-index:2;
    clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);
  }
  .tag.unavailable{ background:#3a2f2a; color:rgba(243,236,226,0.55); }

  .img-wrap{
    aspect-ratio:3/4;
    width:100%;
    background:
      linear-gradient(160deg, #2b221c, #17120f);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-placeholder{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:rgba(243,236,226,0.25);
    font-size:14px;
    text-align:center;
    padding:20px;
  }

  .info{ padding:18px 18px 20px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .info h3{ font-size:22px; font-weight:500; }
  .meta{ font-size:12px; color:rgba(243,236,226,0.55); letter-spacing:0.03em; }
  .sizes{ font-size:12px; color:var(--rose-light); margin-top:2px; }
  .price{ font-size:15px; margin-top:6px; color:var(--cream); font-weight:400; }
  .price span{ color:rgba(243,236,226,0.5); font-size:12px; }

  .reserve{
    margin-top:12px;
    display:inline-block;
    text-align:center;
    background:transparent;
    border:1px solid var(--rose);
    color:var(--rose-light);
    text-decoration:none;
    padding:10px 0;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    transition:background .2s ease,color .2s ease;
  }
  .reserve:hover{ background:var(--rose); color:var(--ink); }
  .reserve.disabled{
    border-color:rgba(243,236,226,0.2);
    color:rgba(243,236,226,0.35);
    pointer-events:none;
  }

  .empty{
    text-align:center;
    padding:80px 24px;
    color:rgba(243,236,226,0.5);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:20px;
  }

  footer{
    text-align:center;
    padding:32px 24px 48px;
    color:rgba(243,236,226,0.35);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }

</style>
</head>



<div class="hero" id="hero">
  <div class="eyebrow">PreciousT Collection</div>
  <h1 id="heroTitle">Pricing and Guidelines</h1>
  <p id="heroSub">Choose a category to browse. Tap Reserve on any dress — your request goes straight to us on WhatsApp.</p>
</div>

/* add information * /


<div id="app"></div>

<footer>PreciousT Collection · Rentals by request · Updated regularly</footer>
