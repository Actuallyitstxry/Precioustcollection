<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PreciousT Collection — Rental Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181310;
    --card:#211A16;
    --cream:#F3ECE2;
    --rose:#B98F73;
    --rose-light:#D8B79A;
    --wine:#5E2233;
    --line:rgba(243,236,226,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;}
  a{color:inherit;}

  /* HERO */
  .hero{
    padding:72px 24px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(185,143,115,0.16), transparent 60%);
    pointer-events:none;
  }
  .eyebrow{
    letter-spacing:0.35em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--rose-light);
    margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(40px,7vw,72px);
    font-weight:500;
    letter-spacing:0.01em;
    line-height:1.05;
  }
  .hero p{
    max-width:480px;
    margin:18px auto 0;
    color:rgba(243,236,226,0.65);
    font-size:15px;
    font-weight:300;
    line-height:1.6;
  }

  /* ===== CATEGORY LANDING ===== */
  .cat-grid{
    max-width:1100px;
    margin:0 auto;
    padding:56px 24px 100px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:24px;
  }
  @media (max-width:640px){ .cat-grid{ grid-template-columns:1fr; } }

  .cat-tile{
    position:relative;
    border:1px solid var(--line);
    background:linear-gradient(160deg,#241C17,#161110);
    padding:44px 32px;
    min-height:220px;
    display:flex; flex-direction:column; justify-content:flex-end;
    gap:8px;
    text-decoration:none;
    overflow:hidden;
    cursor:pointer;
    transition:transform .3s ease, border-color .3s ease;
  }
  .cat-tile:hover{ transform:translateY(-5px); border-color:var(--rose); }
  .cat-tile::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 85% 15%, rgba(185,143,115,0.18), transparent 55%);
    pointer-events:none;
  }
  .cat-index{
    position:absolute; top:20px; right:24px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:rgba(243,236,226,0.3);
  }
  .cat-tile h2{
    font-size:34px;
    font-weight:500;
  }
  .cat-tile .cat-tagline{
    font-size:13px;
    color:rgba(243,236,226,0.55);
    font-weight:300;
    max-width:320px;
  }
  .cat-tile .cat-count{
    margin-top:10px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rose-light);
  }
  .cat-tile .cat-arrow{
    position:absolute; bottom:28px; right:28px;
    font-size:20px;
    color:var(--rose-light);
    transition:transform .25s ease;
  }
  .cat-tile:hover .cat-arrow{ transform:translateX(6px); }

  /* ===== CATEGORY PAGE ===== */
  .cat-header{
    max-width:1280px;
    margin:0 auto;
    padding:40px 24px 0;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(243,236,226,0.55);
    text-decoration:none;
    margin-bottom:22px;
    transition:color .2s ease;
  }
  .back-link:hover{ color:var(--rose-light); }

  /* FILTER BAR */
  .filters{
    position:sticky; top:0; z-index:20;
    background:rgba(24,19,16,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
    display:flex; gap:12px; flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    margin-top:28px;
  }
  .filters input, .filters select{
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream);
    padding:9px 14px;
    border-radius:2px;
    font-family:'Jost',sans-serif;
    font-size:13px;
    font-weight:300;
    outline:none;
  }
  .filters input{min-width:180px;}
  .filters input::placeholder{color:rgba(243,236,226,0.4);}
  .filters select{cursor:pointer;}
  .filters option{background:var(--ink);}
  .count{
    font-size:12px;
    letter-spacing:0.08em;
    color:rgba(243,236,226,0.5);
    text-transform:uppercase;
    margin-left:auto;
  }

  /* GRID */
  .grid{
    max-width:1280px;
    margin:0 auto;
    padding:40px 24px 100px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:28px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    position:relative;
    display:flex; flex-direction:column;
    transition:transform .25s ease, border-color .25s ease;
  }
  .card:hover{ transform:translateY(-4px); border-color:var(--rose); }

  .tag{
    position:absolute; top:12px; left:0;
    background:var(--wine);
    color:var(--cream);
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:5px 12px 5px 10px;
    z-index:2;
    clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);
  }
  .tag.unavailable{ background:#3a2f2a; color:rgba(243,236,226,0.55); }

  .img-wrap{
    aspect-ratio:3/4;
    width:100%;
    background:
      linear-gradient(160deg, #2b221c, #17120f);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-track{ display:flex; width:100%; height:100%; }
  .img-slide{ flex-shrink:0; width:100%; height:100%; }
  .img-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-placeholder{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:rgba(243,236,226,0.25);
    font-size:14px;
    text-align:center;
    padding:20px;
  }
  .img-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(24,19,16,0.55);
    color:var(--cream);
    border:none;
    width:26px; height:26px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    z-index:3;
    opacity:0;
    transition:opacity .2s ease, background .2s ease;
  }
  .img-nav:hover{ background:var(--rose); color:var(--ink); }
  .img-wrap:hover .img-nav{ opacity:1; }
  .img-nav.prev{ left:8px; }
  .img-nav.next{ right:8px; }
  .img-dots{
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; justify-content:center; gap:5px;
    z-index:3;
  }
  .img-dot{
    width:5px; height:5px; border-radius:50%;
    background:rgba(243,236,226,0.4);
    transition:background .2s ease;
  }
  .img-dot.active{ background:var(--rose-light); }

  .info{ padding:18px 18px 20px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .info h3{ font-size:22px; font-weight:500; }
  .meta{ font-size:12px; color:rgba(243,236,226,0.55); letter-spacing:0.03em; }
  .sizes{ font-size:12px; color:var(--rose-light); margin-top:2px; }
  .price{ font-size:15px; margin-top:6px; color:var(--cream); font-weight:400; }
  .price span{ color:rgba(243,236,226,0.5); font-size:12px; }

  .reserve{
    margin-top:12px;
    display:inline-block;
    text-align:center;
    background:transparent;
    border:1px solid var(--rose);
    color:var(--rose-light);
    text-decoration:none;
    padding:10px 0;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    transition:background .2s ease,color .2s ease;
  }
  .reserve:hover{ background:var(--rose); color:var(--ink); }
  .reserve.disabled{
    border-color:rgba(243,236,226,0.2);
    color:rgba(243,236,226,0.35);
    pointer-events:none;
  }

  .empty{
    text-align:center;
    padding:80px 24px;
    color:rgba(243,236,226,0.5);
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:20px;
  }

  footer{
    text-align:center;
    padding:32px 24px 48px;
    color:rgba(243,236,226,0.35);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }

  /* LOADING SCREEN */
  #loader{
    position:fixed; inset:0; z-index:100;
    background:var(--ink);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:22px;
    transition:opacity 0.6s ease, visibility 0.6s ease;
  }
  #loader.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #loader::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 40%, rgba(185,143,115,0.14), transparent 65%);
    pointer-events:none;
  }
  .loader-mark{
    position:relative;
    width:80px; height:80px;
    display:flex; align-items:center; justify-content:center;
  }
  .loader-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid var(--line); }
  .loader-ring::before{
    content:"";
    position:absolute; inset:-1px;
    border-radius:50%;
    border:1px solid transparent;
    border-top-color:var(--rose);
    border-right-color:var(--rose-light);
    animation:spin 1.4s linear infinite;
  }
  .loader-initial{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:28px;
    color:var(--rose-light);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .loader-word{
    font-family:'Cormorant Garamond',serif;
    font-size:24px;
    letter-spacing:0.08em;
    color:var(--cream);
  }
  .loader-sub{
    font-size:10px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:rgba(243,236,226,0.4);
    margin-top:-12px;
  }
  .loader-bar-track{
    width:200px;
    height:1px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .loader-bar-fill{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    background:var(--rose);
    transition:width 0.25s ease;
  }

  /* GUIDELINES NAV BUTTON */
  .guide-btn{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:24px;
    padding:11px 26px;
    border:1px solid var(--rose);
    color:var(--rose-light);
    text-decoration:none;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    transition:background .2s ease, color .2s ease;
    position:relative;
    z-index:1;
  }
  .guide-btn:hover{ background:var(--rose); color:var(--ink); }

  /* GUIDELINES PAGE */
  .guide-wrap{
    max-width:760px;
    margin:0 auto;
    padding:44px 24px 100px;
  }
  .guide-section{
    border-top:1px solid var(--line);
    padding:32px 0;
  }
  .guide-section:first-of-type{ border-top:none; }
  .guide-section h2{
    font-size:26px;
    font-weight:500;
    margin-bottom:14px;
  }
  .guide-section p{
    color:rgba(243,236,226,0.7);
    font-size:14px;
    font-weight:300;
    line-height:1.75;
    margin-bottom:10px;
  }
  .guide-section ul{
    list-style:none;
    display:flex; flex-direction:column; gap:10px;
  }
  .guide-section li{
    color:rgba(243,236,226,0.7);
    font-size:14px;
    font-weight:300;
    line-height:1.6;
    padding-left:20px;
    position:relative;
  }
  .guide-section li::before{
    content:"—";
    position:absolute; left:0;
    color:var(--rose);
  }
  .price-table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
  }
  .price-table th{
    text-align:left;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(243,236,226,0.45);
    font-weight:400;
    padding:0 0 12px;
    border-bottom:1px solid var(--line);
  }
  .price-table td{
    padding:14px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
    font-weight:300;
  }
  .price-table td:first-child{
    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    font-weight:500;
  }
  .price-table td:last-child, .price-table th:last-child{ text-align:right; color:var(--rose-light); }
  .loader-status{
    font-size:10px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:rgba(243,236,226,0.35);
    min-height:14px;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-mark">
    <div class="loader-ring"></div>
    <div class="loader-initial">P</div>
  </div>
  <div>
    <div class="loader-word" style="text-align:center;">PreciousT Collection</div>
    <div class="loader-sub" style="text-align:center;transform: translateY(20px);">The Wardrobe</div>
  </div>
  <div class="loader-bar-track"><div class="loader-bar-fill" id="loaderBarFill"></div></div>
  <div class="loader-status" id="loaderStatus">Preparing your wardrobe…</div>
</div>

<div class="hero" id="hero">
  <div class="eyebrow">PreciousT Collection</div>
  <h1 id="heroTitle">The Wardrobe</h1>
  <p id="heroSub">Choose a category to browse. Tap Reserve on any dress — your request goes straight to us on WhatsApp.</p>
  <a href="#/guidelines" class="guide-btn">Prices &amp; Rental Guidelines →</a>
</div>

<div id="app"></div>

<footer>PreciousT Collection · Rentals by request · Updated regularly</footer>

<script>
/* ============================================================
   CONFIG — edit these two lines
   ============================================================ */
const WHATSAPP_NUMBER = "27000000000"; // replace with PreciousT's WhatsApp number, country code no + or 0-prefix
const BRAND_NAME = "PreciousT Collection";

/* ============================================================
   CATEGORIES — the 4 tiers clients choose from on the landing page.
   Edit the tagline text if you want, but keep the "key" values
   exactly matching what you use in each dress's "category" field below.
   ============================================================ */
const CATEGORIES = [
  { key: "Signature Dresses", tagline: "Our most requested, one-of-a-kind pieces" },
  { key: "Premium Dresses",   tagline: "Top-tier gowns for standout occasions" },
  { key: "Short Dresses",     tagline: "Cocktail-length, easy elegance" },
  { key: "Standard Dresses",  tagline: "Everyday rental essentials" }
];

/* ============================================================
   PRICING & GUIDELINES PAGE — edit all text/prices freely.
   pricingTiers rows show in a simple table; guidelineSections
   are free-text blocks, each with a heading and either
   paragraph text or a bullet list.
   ============================================================ */
const PRICING_TIERS = [
  { tier: "Standard Dresses",  price: "R2 000" },
  { tier: "Short Dresses",     price: "R2 500" },
  { tier: "Premium Dresses",   price: "R3 500" },
  { tier: "Signature Dresses", price: "R4 000" },
  { tier: "Security Deposit (refundable)", price: "R500 KZN · R1000 Out of Province" }
];

const GUIDELINE_SECTIONS = [
  {
    heading: "About PreciousT Collection",
    type: "paragraph",
    text: "At PreciousT Collection, each dress is chosen for its elegance, quality, and ability to make you feel unforgettable. All dresses are maintained with professional care to ensure they arrive in pristine condition for your event."
  },
  {
    heading: "Booking Requirements",
    type: "list",
    items: [
      "A 50% deposit (or full payment)",
      "Contact details",
      "Confirmed event date",
      "Bookings are secured once payments have been made"
    ]
  },
  {
    heading: "Fittings",
    type: "list",
    items: [
      "Fittings will be scheduled upon request to ensure the dress suits you perfectly",
      "We do your alterations"
    ]
  },
  {
    heading: "Rental Duration",
    type: "list",
    items: [
      "All rentals follow the standard PreciousT Collection period: 3–5 days (depending on the event)",
      "Pick-up and return dates will be confirmed during booking",
      "Late returns incur a late fee per day"
    ]
  },
  {
    heading: "Contact Info",
    type: "list",
    items: [
      "PreciousT Collection — Elegant Custom & Rental Dresses",
      "Phone: +27 72 029 1850",
      "Email: Precioustcollections@gmail.com",
      "Location: 237 Bartle Road, Umbilo, Durban",
      "Instagram: @precioust_collection",
      "TikTok: @precioustcollection"
    ]
  }
];

/* ============================================================
   DRESSES — this is your catalogue data.
   To add a new dress, copy one {...} block below and edit it.

   Fields:
   name      – dress name
   category  – must be exactly one of: "Signature Dresses", "Premium Dresses",
               "Short Dresses", "Standard Dresses"
   colour    – main colour, shown under the name
   sizes     – array of available sizes, e.g. ["S","M","L"]
   price     – rental price as a number (no currency symbol)
   available – true or false. If false, shows "Currently Out" and disables Reserve
   images    – an ARRAY of direct image links, e.g. ["url1.jpg","url2.jpg"].
               Add as many as you like (front, back, detail shots, etc.) —
               clients can swipe/arrow through them on the card.
               Leave as [] to show a placeholder until you add photos.

   HOW TO GET A DIRECT GOOGLE DRIVE IMAGE LINK:
   1. Right-click the photo in Drive → Share → "Anyone with the link"
   2. Copy the file ID from the share link (the long code between /d/ and /view)
   3. Use this format: https://lh3.googleusercontent.com/d/FILE_ID
   (Regular Drive share links won't display as images — this format will.)

   NOTE ON CATEGORIES: I've placed the 6 sample dresses below across all
   4 tiers as a starting example. "Premium"/"Signature" vs "Short"/"Standard"
   can overlap in real life (a short dress could also be premium priced) —
   since each dress can only sit in one category here, decide which single
   bucket best fits each real dress as you add them.
   ============================================================ */

const dresses = [
  {
    name: "Rosé Cascade Gown",
    category: "Signature Dresses",
    colour: "Dusty Rose",
    sizes: ["S","M","L"],
    price: 1200,
    available: true,
    images: "https://lh3.googleusercontent.com/d/1Dzqa-N2KR1EbRiPBg3_362yPoFL4gd3F"
  },
  {
    name: "Champagne Whisper",
    category: "Premium Dresses",
    colour: "Champagne",
    sizes: ["M","L","XL"],
    price: 1100,
    available: true,
    images: []
  },
  {
    name: "Sultry Fringe Mermaid",
    category: "Premium Dresses",
    colour: "Black",
    sizes: ["S","M"],
    price: 1350,
    available: false,
    images: []
  },
  {
    name: "Emerald Line Dress",
    category: "Short Dresses",
    colour: "Emerald Green",
    sizes: ["S","M","L"],
    price: 800,
    available: true,
    images: []
  },
  {
    name: "Ivory Draped Set",
    category: "Signature Dresses",
    colour: "Ivory",
    sizes: ["M","L"],
    price: 1500,
    available: true,
    images: []
  },
  {
    name: "Midnight Satin Slip",
    category: "Standard Dresses",
    colour: "Navy",
    sizes: ["S","M","L","XL"],
    price: 750,
    available: true,
    images: []
  }
];

/* ============================================================
   Below this line is the engine — no need to edit
   ============================================================ */

function waLink(d){
  let msgText = `Hi! I'd love to reserve the "${d.name}" from ${BRAND_NAME}. Is it available?`;
  if (d.images && d.images.length){
    const toFullUrl = (src) => {
      const isAbsolute = /^https?:\/\//i.test(src);
      return isAbsolute ? src : `${location.origin}${location.pathname.replace(/[^/]*$/, '')}${src}`;
    };
    if (d.images.length === 1){
      msgText += `\nPhoto: ${toFullUrl(d.images[0])}`;
    } else {
      msgText += `\nPhotos:\n` + d.images.map(toFullUrl).join('\n');
    }
  }
  const msg = encodeURIComponent(msgText);
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
}

function dressCardHTML(d){
  const images = d.images || [];
  let galleryHTML;

  if (images.length === 0){
    galleryHTML = `<div class="img-placeholder">Photo coming soon<br>— ${d.name} —</div>`;
  } else if (images.length === 1){
    galleryHTML = `<img src="${images[0]}" alt="${d.name}">`;
  } else {
    const slides = images.map(url => `<div class="img-slide"><img src="${url}" alt="${d.name}"></div>`).join('');
    const dots = images.map((_, i) => `<span class="img-dot ${i === 0 ? 'active' : ''}"></span>`).join('');
    galleryHTML = `
      <div class="img-track" data-index="0">${slides}</div>
      <button class="img-nav prev" onclick="navImage(this,-1)" aria-label="Previous photo">‹</button>
      <button class="img-nav next" onclick="navImage(this,1)" aria-label="Next photo">›</button>
      <div class="img-dots">${dots}</div>
    `;
  }

  return `
    <div class="card">
      <span class="tag ${d.available ? '' : 'unavailable'}">${d.available ? 'Available' : 'Currently Out'}</span>
      <div class="img-wrap">${galleryHTML}</div>
      <div class="info">
        <h3>${d.name}</h3>
        <div class="meta">${d.category} · ${d.colour}</div>
        <div class="price">R${d.price} <span>/ rental</span></div>
        <a class="reserve ${d.available ? '' : 'disabled'}" href="${d.available ? waLink(d) : '#'}" target="_blank" rel="noopener">
          ${d.available ? 'Reserve on WhatsApp' : 'Unavailable'}
        </a>
      </div>
    </div>
  `;
}

function navImage(btn, dir){
  const wrap = btn.closest('.img-wrap');
  const track = wrap.querySelector('.img-track');
  const dots = wrap.querySelectorAll('.img-dot');
  const total = dots.length;
  let idx = parseInt(track.dataset.index, 10);
  idx = (idx + dir + total) % total;
  track.dataset.index = idx;
  track.style.transform = `translateX(-${idx * 100}%)`;
  dots.forEach((dot, i) => dot.classList.toggle('active', i === idx));
}

/* ---------- ROUTING ---------- */
// Home: #/
// Category: #/category/Signature%20Dresses

function parseHash(){
  const hash = decodeURIComponent(location.hash || "#/");
  const parts = hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "category" && parts[1]) {
    return { view: "category", category: parts[1] };
  }
  if (parts[0] === "guidelines") {
    return { view: "guidelines" };
  }
  return { view: "home" };
}

function renderHome(){
  document.getElementById('heroTitle').textContent = "The Wardrobe";
  document.getElementById('heroSub').textContent = "Choose a category to browse. Tap Reserve on any dress — your request goes straight to us on WhatsApp.";

  const app = document.getElementById('app');
  app.innerHTML = `<div class="cat-grid" id="catGrid"></div>`;
  const grid = document.getElementById('catGrid');

  CATEGORIES.forEach((cat, i) => {
    const count = dresses.filter(d => d.category === cat.key).length;
    const tile = document.createElement('a');
    tile.className = "cat-tile";
    tile.href = `#/category/${encodeURIComponent(cat.key)}`;
    tile.innerHTML = `
      <span class="cat-index">0${i+1}</span>
      <h2>${cat.key}</h2>
      <div class="cat-tagline">${cat.tagline}</div>
      <div class="cat-count">${count} dress${count === 1 ? '' : 'es'}</div>
      <span class="cat-arrow">→</span>
    `;
    grid.appendChild(tile);
  });
}

function renderCategory(categoryKey){
  const catMeta = CATEGORIES.find(c => c.key === categoryKey);
  document.getElementById('heroTitle').textContent = catMeta ? catMeta.key : categoryKey;
  document.getElementById('heroSub').textContent = catMeta ? catMeta.tagline : "";

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="cat-header">
      <a class="back-link" href="#/">← All Categories</a>
    </div>
    <div class="filters">
      <input id="search" type="text" placeholder="Search by name or colour…">
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">No dresses match those filters — try clearing a search.</div>
  `;

  const categoryDresses = dresses.filter(d => d.category === categoryKey);

  function draw(){
    const q = document.getElementById('search').value.trim().toLowerCase();

    const filtered = categoryDresses.filter(d => {
      const matchesQ = !q || d.name.toLowerCase().includes(q) || d.colour.toLowerCase().includes(q);
      return matchesQ;
    });

    document.getElementById('count').textContent = `${filtered.length} of ${categoryDresses.length} dresses`;

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    grid.innerHTML = filtered.map(dressCardHTML).join("");
    empty.style.display = filtered.length === 0 ? "block" : "none";
  }

  document.getElementById('search').addEventListener('input', draw);
  draw();
}

function renderGuidelines(){
  document.getElementById('heroTitle').textContent = "Prices & Rental Guidelines";
  document.getElementById('heroSub').textContent = "Everything to know before you book — please read this before reserving a dress.";

  const app = document.getElementById('app');

  const priceRows = PRICING_TIERS.map(p => `
    <tr><td>${p.tier}</td><td>${p.price}</td></tr>
  `).join('');

  const sectionsHTML = GUIDELINE_SECTIONS.map(s => {
    const body = s.type === "list"
      ? `<ul>${s.items.map(i => `<li>${i}</li>`).join('')}</ul>`
      : `<p>${s.text}</p>`;
    return `<div class="guide-section"><h2>${s.heading}</h2>${body}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="cat-header">
      <a class="back-link" href="#/">← All Categories</a>
    </div>
    <div class="guide-wrap">
      <div class="guide-section">
        <h2>Rental Pricing</h2>
        <table class="price-table">
          <tr><th>Category</th><th>Price Range</th></tr>
          ${priceRows}
        </table>
      </div>
      ${sectionsHTML}
    </div>
  `;
}

function router(){
  const route = parseHash();
  if (route.view === "category") {
    renderCategory(route.category);
  } else if (route.view === "guidelines") {
    renderGuidelines();
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', router);
router();

/* ---- Loading screen: tracks real progress of dress photos ---- */
(function initLoader(){
  const loader = document.getElementById('loader');
  const barFill = document.getElementById('loaderBarFill');
  const status = document.getElementById('loaderStatus');
  const MIN_DISPLAY_MS = 1100; // keeps the screen from flashing if images load instantly
  const startTime = Date.now();

  const imagesToLoad = dresses.flatMap(d => d.images || []);
  const total = imagesToLoad.length;
  let loaded = 0;

  function updateProgress(){
    const pct = total === 0 ? 100 : Math.round((loaded / total) * 100);
    barFill.style.width = pct + "%";
    status.textContent = total === 0
      ? "Almost there…"
      : `Loading dresses… ${loaded}/${total}`;
  }

  function finish(){
    const elapsed = Date.now() - startTime;
    const wait = Math.max(0, MIN_DISPLAY_MS - elapsed);
    status.textContent = "Welcome";
    setTimeout(() => loader.classList.add('hidden'), wait);
  }

  if (total === 0){
    updateProgress();
    finish();
    return;
  }

  updateProgress();
  imagesToLoad.forEach(src => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loaded++;
      updateProgress();
      if (loaded === total) finish();
    };
    img.src = src;
  });

  // Safety net: never let the loader hang forever if an image stalls
  setTimeout(finish, 6000);
})();
</script>
